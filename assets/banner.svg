<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Sanskruti Mahajan · AI &amp; Data Engineer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#132036"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0 L0 0 0 28" fill="none" stroke="#1F2A3A" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#58A6FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c0"><rect x="60" y="118" height="40" width="0"><animate attributeName="width" values="0;560;560;0;0" keyTimes="0;0.1;0.2;0.25;1" dur="12s" begin="0s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c1"><rect x="60" y="118" height="40" width="0"><animate attributeName="width" values="0;560;560;0;0" keyTimes="0;0.1;0.2;0.25;1" dur="12s" begin="3s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c2"><rect x="60" y="118" height="40" width="0"><animate attributeName="width" values="0;560;560;0;0" keyTimes="0;0.1;0.2;0.25;1" dur="12s" begin="6s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c3"><rect x="60" y="118" height="40" width="0"><animate attributeName="width" values="0;560;560;0;0" keyTimes="0;0.1;0.2;0.25;1" dur="12s" begin="9s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <rect width="1000" height="220" rx="14" fill="url(#bg)"/>
  <rect width="1000" height="220" rx="14" fill="url(#grid)" opacity="0.6"/>

  <!-- name + title -->
  <text x="60" y="82" font-size="40" font-weight="700" fill="#F0F6FC">Sanskruti Mahajan</text>
  <text x="62" y="110" font-size="15" fill="#8B949E" letter-spacing="1.5">AI &amp; DATA ENGINEER  ·  NORTHEASTERN UNIVERSITY  ·  BOSTON</text>

  <!-- typing roles -->
  <g font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="20" fill="#58A6FF">
    <text x="62" y="146" clip-path="url(#c0)">&gt; building LLM agents, RAG and MCP tools</text>
    <text x="62" y="146" clip-path="url(#c1)">&gt; shipping data pipelines at 10M+ rows/day</text>
    <text x="62" y="146" clip-path="url(#c2)">&gt; securing cloud infrastructure as code</text>
    <text x="62" y="146" clip-path="url(#c3)">&gt; healthcare · retail · finance · quant</text>
  </g>
  <rect x="62" y="176" width="44" height="3" rx="1.5" fill="#58A6FF"><animate attributeName="width" values="44;120;44" dur="4s" repeatCount="indefinite"/></rect>

  <!-- neural network -->
  <g stroke="#2F81F7" stroke-opacity="0.35" stroke-width="1.2">
    <line x1="700" y1="60" x2="800" y2="40"/><line x1="700" y1="60" x2="800" y2="110"/><line x1="700" y1="60" x2="800" y2="180"/>
    <line x1="700" y1="160" x2="800" y2="40"/><line x1="700" y1="160" x2="800" y2="110"/><line x1="700" y1="160" x2="800" y2="180"/>
    <line x1="800" y1="40" x2="900" y2="80"/><line x1="800" y1="110" x2="900" y2="80"/><line x1="800" y1="180" x2="900" y2="80"/>
    <line x1="800" y1="40" x2="900" y2="150"/><line x1="800" y1="110" x2="900" y2="150"/><line x1="800" y1="180" x2="900" y2="150"/>
  </g>

  <!-- signals travelling through the network -->
  <g fill="#79C0FF">
    <circle r="3.5"><animateMotion dur="2.4s" repeatCount="indefinite" path="M700,60 L800,110 L900,80"/></circle>
    <circle r="3.5"><animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite" path="M700,160 L800,40 L900,150"/></circle>
    <circle r="3.5"><animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite" path="M700,60 L800,180 L900,150"/></circle>
    <circle r="3.5"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M700,160 L800,110 L900,80"/></circle>
  </g>

  <!-- nodes -->
  <g>
    <circle cx="700" cy="60" r="16" fill="url(#glow)"><animate attributeName="r" values="12;20;12" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="160" r="16" fill="url(#glow)"><animate attributeName="r" values="12;20;12" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="40" r="16" fill="url(#glow)"><animate attributeName="r" values="12;20;12" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="110" r="16" fill="url(#glow)"><animate attributeName="r" values="12;20;12" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="180" r="16" fill="url(#glow)"><animate attributeName="r" values="12;20;12" dur="2.4s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="80" r="16" fill="url(#glow)"><animate attributeName="r" values="12;20;12" dur="2.4s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="150" r="16" fill="url(#glow)"><animate attributeName="r" values="12;20;12" dur="2.4s" begin="0.2s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#C9D1D9" stroke="#2F81F7" stroke-width="2">
    <circle cx="700" cy="60" r="7"/><circle cx="700" cy="160" r="7"/>
    <circle cx="800" cy="40" r="7"/><circle cx="800" cy="110" r="7"/><circle cx="800" cy="180" r="7"/>
    <circle cx="900" cy="80" r="7"/><circle cx="900" cy="150" r="7"/>
  </g>
</svg>
