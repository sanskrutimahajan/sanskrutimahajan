<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 170" width="1000" height="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Sanskruti Mahajan · AI &amp; Data Engineer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#15213A"/>
    </linearGradient>
    <radialGradient id="orbA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2F81F7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2F81F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A371F7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#A371F7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F81F7"/>
      <stop offset="1" stop-color="#A371F7"/>
    </linearGradient>
    <clipPath id="card"><rect width="1000" height="170" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="170" fill="url(#bg)"/>
    <!-- two soft light orbs drifting slowly in the background -->
    <circle cx="780" cy="60" r="150" fill="url(#orbA)">
      <animate attributeName="cx" values="780;860;780" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;100;60" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="920" cy="140" r="130" fill="url(#orbB)">
      <animate attributeName="cx" values="920;840;920" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="140;90;140" dur="18s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="56" y="72" font-size="40" font-weight="700" fill="#F0F6FC">Sanskruti Mahajan</text>
  <rect x="58" y="88" width="64" height="4" rx="2" fill="url(#accent)"/>
  <text x="58" y="120" font-size="19" font-weight="600" fill="#C9D1D9">AI &amp; Data Engineer</text>
  <text x="58" y="146" font-size="15" fill="#8B949E">LLM agents  ·  Data pipelines  ·  Cloud infrastructure  ·  Healthcare &amp; Retail</text>
</svg>
